<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R2R Renewal Desk</title>
<meta name="description" content="Annual renewals, reminders and receipts for R2R Tutorials.">
<meta name="theme-color" content="#F2F3EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Renewal Desk">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>
  (function () { var t = null; try { t = localStorage.getItem('r2r_desk_theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', t || 'light'); })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="light"]{
  --bg:#F2F3EE; --card:#FFFFFF; --border:#D9DCD2; --track:#E2E4DC; --line:#ECEEE7;
  --ink:#16181D; --on-ink:#FFFFFF; --text2:#3A3F46; --text3:#555B63;
  --pos:#1E6B45; --neg:#A12B1F; --alert:#B3261E; --on-alert:#FFFFFF;
  --cream:#FAF4E4; --cream-line:#E8DFC8;
  --p-blue:#DCE7F5; --p-mint:#DDEFE3; --p-blush:#F8E1DC; --p-butter:#FBEFC9; --p-lilac:#E9E1F4; --butter-ink:#5C4300;
  --topbar:rgba(242,243,238,.95); --scrim:rgba(0,0,0,.45);
}
:root[data-theme="dark"]{
  --bg:#111413; --card:#222725; --border:#2F3533; --track:#181C1A; --line:#2F3533;
  --ink:#F1F2EC; --on-ink:#111413; --text2:#C9CEC9; --text3:#A3AAA6;
  --pos:#6FCF97; --neg:#F28B82; --alert:#8E1F19; --on-alert:#FFFFFF;
  --cream:#2A2620; --cream-line:#3B352B;
  --p-blue:#1F2C3D; --p-mint:#1D3327; --p-blush:#3D2320; --p-butter:#3A3118; --p-lilac:#2E2740; --butter-ink:#F0D88A;
  --topbar:rgba(17,20,19,.95); --scrim:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.45;
  overscroll-behavior-y:contain;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* shell */
.bar{position:sticky;top:0;z-index:100;background:var(--topbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.bar-brand{font-size:18px;font-weight:800;letter-spacing:-.01em;text-decoration:none}
.menu-btn{min-height:44px;min-width:44px;border:1px solid var(--ink);border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.pill-btn{min-height:40px;padding:0 14px;border:1px solid var(--ink);border-radius:99px;background:transparent;font-size:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.pill-btn:hover{background:var(--track)}
.pill-btn.fill{background:var(--p-mint)}
.bar .pill-btn{margin-left:auto}
.main{max-width:680px;margin:0 auto;padding:24px 18px 48px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}

.drawer{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:86vw;background:var(--bg);border-right:1px solid var(--border);z-index:300;
  padding:28px 18px;padding-top:max(28px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:24px;transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto}
body.menu-open .drawer{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
.scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:250}
body.menu-open .scrim.menu{display:block}
.side-brand{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.side-brand b{font-size:20px;font-weight:800}
.side-brand span{font-size:12px;color:var(--text3)}
.side-nav{display:flex;flex-direction:column;gap:4px}
.tab-btn{display:flex;align-items:center;min-height:46px;padding:0 14px;border:0;border-radius:12px;background:transparent;font-size:15px;font-weight:700;text-align:left;text-decoration:none}
.tab-btn:hover{background:var(--track)}
.tab-btn.active{background:var(--ink);color:var(--on-ink)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.updated{font-size:11px;color:var(--text3);background:var(--track);padding:6px 10px;border-radius:99px;align-self:flex-start}

/* page pieces */
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 16px}
.chip{font-size:13px;font-weight:600;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text2);
  display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.chip.on{border-color:var(--ink);background:var(--p-butter);color:var(--ink)}
.chip.test{border-color:var(--ink);background:var(--p-lilac);color:var(--ink)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--pos)}
.pg-head{margin-bottom:16px}
.pg-kicker{font-size:14px;color:var(--text3)}
.pg-big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.08;overflow-wrap:anywhere}
.pg-sub{font-size:13px;font-weight:700;color:var(--pos);margin-top:2px}
.pg-sub.neg{color:var(--neg)} .pg-sub.warn{color:var(--butter-ink)} .pg-sub.dim{color:var(--text3)}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pills.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pill{border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;background:var(--card);min-width:0}
.pill span{font-size:12px;color:var(--text3)}
.pill b{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.blue{background:var(--p-blue)} .pill.mint{background:var(--p-mint)} .pill.blush{background:var(--p-blush)}
.pill.butter{background:var(--p-butter)} .pill.lilac{background:var(--p-lilac)}
.pill b.neg{color:var(--neg)}
.sec{font-size:15px;font-weight:700;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.cardx{background:var(--card);border-radius:16px;padding:4px 16px;margin-bottom:10px}
.cardx.pad{padding:16px}
.cream{background:var(--cream);border-radius:16px;padding:2px 14px;margin-bottom:10px}
.cream .rowx+.rowx{border-top:1px solid var(--cream-line)}
.rowx{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;text-decoration:none;color:inherit;width:100%;background:none;border:0;text-align:left}
.cardx .rowx+.rowx{border-top:1px solid var(--line)}
button.rowx,a.rowx{cursor:pointer}
.rowx .a{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.rowx .b{font-size:12px;color:var(--text3);margin-top:2px}
.rowx .b.neg{color:var(--neg);font-weight:700} .rowx .b.pos{color:var(--pos);font-weight:700}
.rowx .c{font-size:15px;font-weight:800;text-align:right;white-space:nowrap}
.rowx .c.pos{color:var(--pos)} .rowx .c.neg{color:var(--neg)}
.tag{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;letter-spacing:.02em;flex-shrink:0}
.tag.sent{background:var(--p-mint);color:var(--pos)} .tag.ready,.tag.open{background:var(--p-blush);color:var(--neg)}
.tag.later{background:var(--track);color:var(--text2)} .tag.sched{background:var(--p-blue);color:var(--ink)} .tag.skip{background:var(--p-butter);color:var(--butter-ink)}

.alert{background:var(--alert);color:var(--on-alert);border-radius:14px;padding:12px 14px;margin:18px 0 14px}
.alert h4{margin:0 0 2px;font-size:13px;font-weight:800}
.alert .sub{font-size:11px;opacity:.85;margin-bottom:6px}
.alert .rowx{border-top:1px solid rgba(255,255,255,.22);padding:8px 0}
.alert .rowx .b{color:rgba(255,255,255,.85);font-size:11px}
.alert .note{margin-top:8px;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:700;line-height:1.4}
.alert .wbtn{background:#fff;color:#B3261E;border:0;border-radius:999px;padding:0 14px;min-height:38px;font-weight:800;font-size:12px;flex-shrink:0}
.upc{background:var(--p-butter);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.upc h4{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--butter-ink)}
.upc .rowx{padding:6px 0}
.upc .rowx .b{color:var(--butter-ink);font-weight:700}
.blush{background:var(--p-blush);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.blush h4{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--neg)}
.blush .rowx{padding:8px 0} .blush .rowx+.rowx{border-top:1px solid rgba(161,43,31,.15)}
.mintbox{background:var(--p-mint);border-radius:14px;padding:12px 14px;margin:14px 0}
.mintbox h4{margin:0 0 4px;font-size:12px;font-weight:800;color:var(--pos)}
.mintbox .rowx{padding:7px 0} .mintbox .rowx+.rowx{border-top:1px solid rgba(30,107,69,.18)}
.mintbox .rowx .a{font-size:14px;font-weight:500} .mintbox .rowx .c{font-size:13px;font-weight:700}
.lilacbox{background:var(--p-lilac);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:13px;line-height:1.5}

.btn{min-height:50px;border:0;border-radius:12px;background:var(--ink);color:var(--on-ink);font-size:15px;font-weight:700;width:100%;
  display:flex;align-items:center;justify-content:center;text-decoration:none;padding:0 16px}
.btn:disabled{opacity:.5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .pill-btn{flex:1;min-height:44px;font-size:13px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.link-btn{background:none;border:0;padding:10px 0;font-size:13px;font-weight:700;text-decoration:underline;color:var(--text2)}
.link-btn.neg{color:var(--neg)}

.seg{display:flex;background:var(--track);border-radius:12px;padding:4px;gap:2px}
.seg button{flex:1;min-height:44px;padding:0 6px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:700}
.seg button.on{background:var(--card)}

.form{display:flex;flex-direction:column;gap:14px}
.fld label,.fld .lbl{display:block;font-size:12px;color:var(--text3);margin-bottom:6px}
.fld.key label{color:var(--ink);font-weight:700}
.fld input,.fld textarea,.fld select{width:100%;min-height:48px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px}
.fld textarea{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.45}
.fld.key input{border:1.5px solid var(--ink)}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--ink)}
:root[data-theme="dark"] .fld input{color-scheme:dark}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--ink)}
.search{width:100%;min-height:48px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;margin-bottom:10px}

.empty{background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:18px;color:var(--text3);font-size:13px;text-align:center;margin-bottom:12px}
.disclaimer{color:var(--text3);font-size:12px;line-height:1.5;padding-top:18px}
.muted{color:var(--text3);font-size:13px;line-height:1.5}

/* chart */
.bars{height:150px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;border-bottom:1px solid var(--line)}
.bars .col{border-radius:4px 4px 0 0;background:var(--track);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;min-height:2px}
.bars .late{background:var(--neg)} .bars .in{background:var(--pos)}
.blabels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;margin-top:7px}
.blabels div{text-align:center;font-size:11px;color:var(--text3);font-weight:500}
.blabels div.now{color:var(--ink);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text2);margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}

/* bottom sheets */
.sheet-scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:400}
.sheet-scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:410;background:var(--bg);border-radius:22px 22px 0 0;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease;
  max-width:680px;margin:0 auto}
.sheet:not(.on){visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--border);margin:0 auto 16px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-head .t{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.x-btn{min-height:44px;min-width:44px;border:1px solid var(--ink);border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.msg{width:100%;background:var(--cream);border:0;border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.55;min-height:220px;resize:vertical}

/* invoice */
.inv-wrap{position:fixed;inset:0;z-index:500;background:var(--scrim);overflow:auto;padding:max(16px,env(safe-area-inset-top)) 12px 40px;display:none}
.inv-wrap.on{display:block}
.inv-tools{max-width:760px;margin:0 auto 12px;display:flex;gap:8px;flex-wrap:wrap}
.inv-tools .pill-btn{background:var(--bg)}
.inv{max-width:760px;margin:0 auto;background:#fff;color:#16181D;border-radius:12px;padding:30px;font-family:'Archivo',Arial,sans-serif}
.inv h2{font-size:24px;margin:0}
.inv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:2px solid #16181D;padding-bottom:16px;margin-bottom:22px}
.inv-lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#555B63;margin-bottom:3px}
.inv table{width:100%;border-collapse:collapse;margin:20px 0}
.inv th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#555B63;border-bottom:1px solid #D9DCD2;padding:0 0 8px;font-weight:600}
.inv td{padding:14px 0;border-bottom:1px solid #ECEEE7;font-size:14px;vertical-align:top}
.inv .num{text-align:right;font-variant-numeric:tabular-nums}
.inv .total td{border:none;padding-top:16px;font-weight:800;font-size:17px}
.inv-foot{margin-top:24px;padding-top:16px;border-top:1px solid #D9DCD2;font-size:12px;color:#3A3F46}
.inv .small{font-size:12px;color:#555B63}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top));background:var(--ink);color:var(--on-ink);
  font-weight:700;font-size:13px;padding:12px 18px;border-radius:999px;z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1}
.busy{opacity:.6;pointer-events:none}

@media(min-width:700px){ .pg-big{font-size:44px} }
@media print{
  body{background:#fff}
  body.printing > *:not(.inv-wrap){display:none!important}
  .inv-wrap{position:static;background:none;padding:0;display:block}
  .inv-tools{display:none}
  .inv{padding:0;border-radius:0;max-width:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="bar">
  <button class="menu-btn" aria-label="Open menu" onclick="menu(true)">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="bar-brand" href="#today">R2R</a>
  <button class="pill-btn" id="theme-btn" onclick="toggleTheme()">Dark mode</button>
</header>

<nav class="drawer" id="drawer" aria-label="Main menu">
  <div class="side-brand"><b>R2R</b><span>Renewal Desk</span></div>
  <div class="side-nav" id="side-nav"></div>
  <div class="side-foot">
    <span class="updated" id="sync-note">On this phone</span>
  </div>
</nav>
<div class="scrim menu" onclick="menu(false)"></div>

<main class="main" id="app"></main>

<div class="sheet-scrim" id="sheet-scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>

<div class="inv-wrap" id="inv-wrap">
  <div class="inv-tools">
    <button class="pill-btn" onclick="printInvoice()">Print / Save PDF</button>
    <button class="pill-btn" onclick="copy(lastInvText,'Invoice copied')">Copy as text</button>
    <button class="pill-btn" onclick="closeInvoice()">Close</button>
  </div>
  <div id="inv-body"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importBackup(event)">

<script>
/* ===== R2R core — shared, unchanged, by the app (index.html) and the autopilot (Code.gs) ===== */
var R2R = (function () {
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function pad(n) { return String(n).padStart(2, '0'); }
  function parse(s) { var p = String(s).split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }
  function iso(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(s, n) { var d = parse(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); }
  function addYears(s, n) {
    var p = String(s).split('-').map(Number);
    var last = new Date(Date.UTC(p[0] + n, p[1], 0)).getUTCDate();      // 29 Feb → 28 Feb
    return (p[0] + n) + '-' + pad(p[1]) + '-' + pad(Math.min(p[2], last));
  }
  /* whole days from a to b (positive when b is later) */
  function diff(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function fmt(s) { var d = parse(s); return pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function fmtDM(s) { var d = parse(s); return pad(d.getUTCDate()) + ' ' + MON[d.getUTCMonth()]; }
  /* Indian financial year, April–March, e.g. "26-27" */
  function fyOf(s) { var p = String(s).split('-').map(Number); var y = p[1] >= 4 ? p[0] : p[0] - 1;
    return String(y).slice(2) + '-' + String(y + 1).slice(2); }
  function fyStart(fy) { return '20' + fy.slice(0, 2) + '-04-01'; }
  function fyEnd(fy) { return '20' + fy.slice(3) + '-03-31'; }
  function prevFy(fy) { var a = +fy.slice(0, 2) - 1; return pad(a) + '-' + pad(a + 1); }
  /* ₹ with Indian grouping: 165000 → ₹1,65,000 */
  function inr(n) {
    n = Math.round(+n || 0); var neg = n < 0, s = String(Math.abs(n));
    var out = s.length > 3 ? s.slice(0, -3).replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + s.slice(-3) : s;
    return (neg ? '-' : '') + '₹' + out;
  }
  function lakh(n) { return n >= 100000 ? '₹' + (n / 100000).toFixed(2).replace(/\.?0+$/, '') + ' L' : inr(n); }
  function words(n) {
    n = Math.round(n); if (n === 0) return 'Zero';
    var o = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve',
      'Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
    var t = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
    function two(x) { return x < 20 ? o[x] : t[Math.floor(x / 10)] + (x % 10 ? ' ' + o[x % 10] : ''); }
    function three(x) { return (x > 99 ? o[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : ''); }
    var out = '', cr = Math.floor(n / 1e7); n %= 1e7; var la = Math.floor(n / 1e5); n %= 1e5;
    var th = Math.floor(n / 1e3); n %= 1e3;
    if (cr) out += three(cr) + ' Crore '; if (la) out += three(la) + ' Lakh ';
    if (th) out += three(th) + ' Thousand '; if (n) out += three(n);
    return out.trim();
  }

  var DEF_CFG = { name: 'Manuel Pinto', biz: 'R2R Tutorials', email: 'learn2earninvesting@gmail.com',
    phone: '', addr: '', upi: '', pay: '', prefix: 'R2R', live: false };

  function normalize(db) {
    db = db || {};
    db.clients = db.clients || []; db.receipts = db.receipts || [];
    db.cfg = Object.assign({}, DEF_CFG, db.cfg || {}); db.seq = db.seq || {}; db.meta = db.meta || {};
    db.clients.forEach(function (c) {
      c.status = c.status || 'active'; c.email = c.email || ''; c.phone = c.phone || ''; c.note = c.note || '';
      c.amount = +c.amount || 0; ensure(c);
    });
    return db;
  }

  /* each renewal ("cycle") remembers what has been sent for that due date */
  function newCycle(due) { return { due: due, headsup: null, invoice: null, invNo: null, wa: [], waHead: null }; }
  function ensure(c) { if (!c.cycle || c.cycle.due !== c.due) c.cycle = newCycle(c.due); c.cycle.wa = c.cycle.wa || []; return c.cycle; }

  function nextNo(db, date) {
    var fy = fyOf(date); db.seq[fy] = (db.seq[fy] || 0) + 1;
    return (db.cfg.prefix || 'R2R') + '/' + fy + '/' + String(db.seq[fy]).padStart(3, '0');
  }
  /* first anniversary of `anchor` on or after `today` */
  function nextAnniv(anchor, today) {
    var y = +today.slice(0, 4), a = String(anchor), s = addYears(a, y - +a.slice(0, 4));
    if (s < today) s = addYears(s, 1);
    if (s < a) s = a;
    return s;
  }

  /* Where a client stands right now. phase:
     lapsed | upcoming (due later) | due (today) | ready (WhatsApp reminder to send) | waiting (next reminder later) | call (3 sent, still unpaid) */
  var MAX_WA = 3, WA_GAP = 7, HEADSUP_DAYS = 14, INVOICE_GRACE = 14;
  function state(c, today) {
    if (c.status !== 'active') return { phase: 'lapsed' };
    var cyc = ensure(c), d = diff(today, c.due), sent = cyc.wa.length;
    if (d > 0) {
      var headsOn = addDays(c.due, -HEADSUP_DAYS);
      return { phase: 'upcoming', days: d, headsOn: headsOn,
        waHead: !c.email && d <= HEADSUP_DAYS && !cyc.waHead };          // no email on file → heads-up by WhatsApp
    }
    if (d === 0 && sent === 0) return { phase: 'due', days: 0, sent: 0, next: 1, nextOn: addDays(c.due, WA_GAP) };
    if (sent >= MAX_WA) {
      var callOn = addDays(cyc.wa[MAX_WA - 1], WA_GAP);
      return { phase: today >= callOn ? 'call' : 'waiting', days: d, sent: sent, next: null, nextOn: callOn };
    }
    var nextOn = sent === 0 ? addDays(c.due, WA_GAP) : addDays(cyc.wa[sent - 1], WA_GAP);
    return { phase: today >= nextOn ? 'ready' : 'waiting', days: d, sent: sent, next: sent + 1, nextOn: nextOn };
  }

  function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var EDITABLE = ['name', 'email', 'phone', 'amount', 'anchor', 'due', 'note'];
  var CFG_KEYS = ['name', 'biz', 'email', 'phone', 'addr', 'upi', 'pay', 'prefix'];

  /* Every change to the books goes through here, on the phone and in the autopilot alike. */
  function apply(db, op, a, today) {
    a = a || {};
    var c = a.id ? db.clients.filter(function (x) { return x.id === a.id; })[0] : null;
    if (['edit', 'remove', 'status', 'pay', 'wa', 'waUndo'].indexOf(op) >= 0 && !c) throw new Error('Client not found');
    switch (op) {
      case 'add': {
        var anchor = a.anchor || today;
        var n = { id: a.newId || uid('c'), name: String(a.name || '').trim(), email: String(a.email || '').trim(),
          phone: String(a.phone || '').trim(), amount: +a.amount || 0, anchor: anchor, note: a.note || '', status: 'active' };
        if (!n.name) throw new Error('Name is required');
        n.due = a.due || nextAnniv(anchor, today);
        db.clients.push(n); ensure(n);
        if (a.paidNow) return apply(db, 'pay', { id: n.id, amount: n.amount, date: anchor, joining: true }, today);
        return n;
      }
      case 'edit':
        EDITABLE.forEach(function (k) { if (k in a) c[k] = k === 'amount' ? (+a[k] || 0) : String(a[k]).trim(); });
        ensure(c); return c;
      case 'remove':
        db.clients = db.clients.filter(function (x) { return x.id !== a.id; }); return null;
      case 'status':
        c.status = a.status === 'lapsed' ? 'lapsed' : 'active';
        if (c.status === 'active' && c.due < today && a.fresh) { c.due = nextAnniv(c.anchor, today); ensure(c); }
        return c;
      case 'pay': {
        var date = a.date || today, cyc = ensure(c);
        var period = a.joining ? c.anchor : c.due;
        var r = { id: uid('r'), clientId: c.id, name: c.name, amount: +a.amount || c.amount, date: date,
          no: cyc.invNo || nextNo(db, date), period: period };
        db.receipts.push(r);
        c.due = addYears(period, 1); c.status = 'active'; ensure(c);
        return r;
      }
      case 'wa': {
        var cy = ensure(c);
        if (a.kind === 'headsup') cy.waHead = today; else if (cy.wa.length < MAX_WA) cy.wa.push(today);
        return c;
      }
      case 'waUndo': { var cz = ensure(c); if (cz.wa.length) cz.wa.pop(); else cz.waHead = null; return c; }
      case 'cfg':
        CFG_KEYS.forEach(function (k) { if (k in a) db.cfg[k] = String(a[k]); }); return db.cfg;
      case 'live':
        db.cfg.live = !!a.live; return db.cfg;
      default: throw new Error('Unknown action: ' + op);
    }
  }

  /* WhatsApp text, written as Manuel */
  function payLine(cfg) {
    if (cfg.upi) return 'You can pay by UPI to ' + cfg.upi + '.';
    if (cfg.pay) return 'Payment details:\n' + cfg.pay;
    return '';
  }
  function message(kind, tone, c, cfg) {
    var first = String(c.name).split(' ')[0], sign = String(cfg.name || 'Manuel').split(' ')[0];
    var amt = inr(c.amount), due = fmt(c.due), pay = payLine(cfg), biz = cfg.biz || 'R2R Tutorials';
    var emailed = c.email && c.cycle && c.cycle.invoice && c.cycle.invoice !== 'skipped';
    if (kind === 'headsup') {
      return 'Hi ' + first + ', hope you’re doing well.\n\nA quick note that your ' + biz + ' subscription renews on ' + due +
        '. The fee for the coming year is ' + amt + '.' + (pay ? '\n\n' + pay : '') +
        '\n\nDo let me know if you’d like to change anything about your plan.\n\n— ' + sign;
    }
    if (tone === 'Short') {
      return 'Hi ' + first + ', quick reminder: ' + biz + ' renewal ' + amt + ' (due ' + fmtDM(c.due) + ').' +
        (cfg.upi ? ' UPI: ' + cfg.upi + '.' : '') + ' Thanks! — ' + sign;
    }
    if (tone === 'Firm') {
      return 'Hi ' + first + ', following up on your ' + biz + ' renewal of ' + amt + ', due since ' + due + '.\n\n' +
        'Could you clear it this week?' + (pay ? ' ' + pay : '') + (emailed ? ' The invoice is in your email.' : '') +
        '\n\nIf you’ve decided not to continue, just tell me and I’ll close your account.\n\n— ' + sign;
    }
    return 'Hi ' + first + ', hope you’re doing well.\n\nA gentle reminder that your ' + biz + ' renewal of ' + amt +
      ' was due on ' + due + '.' + (emailed ? ' I’ve emailed the invoice.' : '') + (pay ? ' ' + pay : '') +
      '\n\nDo let me know if you’d like to continue or if anything has changed.\n\n— ' + sign;
  }
  function waLink(phone, text) {
    var d = String(phone || '').replace(/\D/g, '');
    if (d.length === 10) d = '91' + d;
    if (d.length === 11 && d[0] === '0') d = '91' + d.slice(1);
    return 'https://wa.me/' + (d || '') + '?text=' + encodeURIComponent(text);
  }

  return { MON: MON, parse: parse, iso: iso, addDays: addDays, addYears: addYears, diff: diff, fmt: fmt, fmtDM: fmtDM,
    fyOf: fyOf, fyStart: fyStart, fyEnd: fyEnd, prevFy: prevFy, inr: inr, lakh: lakh, words: words,
    DEF_CFG: DEF_CFG, normalize: normalize, ensure: ensure, newCycle: newCycle, nextNo: nextNo, nextAnniv: nextAnniv,
    state: state, apply: apply, message: message, waLink: waLink, uid: uid,
    MAX_WA: MAX_WA, WA_GAP: WA_GAP, HEADSUP_DAYS: HEADSUP_DAYS, INVOICE_GRACE: INVOICE_GRACE };
})();

const KEY_DB = 'r2r_desk_v4', KEY_OLD = 'r2r_desk_v3', KEY_CONN = 'r2r_desk_conn', KEY_THEME = 'r2r_desk_theme';
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};
const S = { db:null, conn:null, synced:null, tone:'Gentle', fySel:null, filter:'All', q:'' };

const pad2 = n => String(n).padStart(2,'0');

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function seed(){
  const db = R2R.normalize({});
  const in2026 = a => { const y = Math.max(2026, +a.slice(0,4)); return R2R.addYears(a, y - +a.slice(0,4)); };
  SEED.forEach((s,i) => {
    const r = in2026(s.anchor);
    db.clients.push({ id:'c'+i, name:s.name, amount:s.amount, anchor:s.anchor,
      due: s.paid2026===true ? R2R.addYears(r,1) : r, email:'', phone:'', note:'', status:'active' });
  });
  SEED.filter(s=>s.paid2026===true).map(s=>({...s, on:in2026(s.anchor)})).sort((a,b)=>a.on<b.on?-1:1).forEach(s => {
    const c = db.clients.find(x=>x.name===s.name);
    db.receipts.push({ id:'r'+c.id, clientId:c.id, name:c.name, amount:s.amount, date:s.on, no:R2R.nextNo(db, s.on), period:s.on });
  });
  return R2R.normalize(db);
}
/* carry over the list saved by the previous version of the app on this phone */
function migrate(old){
  const db = { clients:[], receipts: old.receipts || [], cfg: Object.assign({}, old.cfg||{}), seq: old.seq || {}, meta:{} };
  (old.clients||[]).forEach(c => {
    const n = { id:c.id, name:c.name, amount:+c.amount||0, anchor:c.anchor, due:c.due, email:c.email||'', phone:c.phone||'', note:c.note||'', status:'active' };
    n.cycle = R2R.newCycle(n.due); if (c.pendingNo) n.cycle.invNo = c.pendingNo;
    db.clients.push(n);
  });
  delete db.cfg.live;
  // the old app shipped a blank "UPI: / Bank: / Account no: / IFSC:" template: keep only lines you filled in
  const lines = String(db.cfg.pay || '').split('\n').map(l => l.trim()).filter(l => l && !/^[^:]+:\s*$/.test(l));
  const upiLine = lines.find(l => /^upi\s*:/i.test(l));
  if (upiLine && !db.cfg.upi) db.cfg.upi = upiLine.replace(/^upi\s*:\s*/i, '');
  db.cfg.pay = lines.filter(l => l !== upiLine).join('\n');
  return R2R.normalize(db);
}
function load(){
  const raw = store.get(KEY_DB);
  if (raw) { try { S.db = R2R.normalize(JSON.parse(raw)); } catch(e) { S.db = null; } }
  if (!S.db) {
    const old = store.get(KEY_OLD);
    if (old) { try { S.db = migrate(JSON.parse(old)); } catch(e) { S.db = null; } }
  }
  if (!S.db) S.db = seed();
  try { S.conn = JSON.parse(store.get(KEY_CONN) || 'null'); } catch(e) { S.conn = null; }
  persist();
}
function persist(){ store.set(KEY_DB, JSON.stringify(S.db)); }

/* ================= talking to the autopilot ================= */
async function call(op, args){
  if (!S.conn) {
    if (['live','test','run'].includes(op)) throw new Error('Connect the autopilot first (Setup).');
    const r = R2R.apply(S.db, op, args, today()); persist(); return r;
  }
  let res;
  try {
    res = await fetch(S.conn.url, { method:'POST', body: JSON.stringify({ key:S.conn.key, op, args }) });
  } catch(e) { throw new Error('No connection. Check your signal and try again.'); }
  const j = await res.json().catch(()=>({ ok:false, error:'The autopilot sent an unreadable reply.' }));
  if (!j.ok) throw new Error(j.error || 'Something went wrong');
  S.db = R2R.normalize(j.db); S.synced = new Date(); persist();
  return j.result;
}
async function pull(silent){
  if (!S.conn) return;
  try {
    const res = await fetch(`${S.conn.url}?a=get&key=${encodeURIComponent(S.conn.key)}`);
    const j = await res.json();
    if (!j.ok) throw new Error(j.error);
    S.db = R2R.normalize(j.db); S.synced = new Date(); persist(); render();
  } catch(e) { if (!silent) toast('Could not reach the autopilot. Showing the copy on this phone.'); renderSync(); }
}
async function act(op, args, okMsg){
  document.body.classList.add('busy');
  try { const r = await call(op, args); render(); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); return r; }
  catch(e) { toast(e.message); throw e; }
  finally { document.body.classList.remove('busy'); }
}

/* ================= numbers for the screens ================= */
function figures(fy){
  const t = today(), active = S.db.clients.filter(c => c.status === 'active');
  const start = R2R.fyStart(fy), end = R2R.fyEnd(fy);
  const recs = S.db.receipts.filter(r => r.date >= start && r.date <= end);
  const collected = recs.reduce((s,r) => s + +r.amount, 0);
  const book = active.reduce((s,c) => s + c.amount, 0);
  const late = active.filter(c => c.due < t).reduce((s,c) => s + c.amount, 0);
  const toCome = active.filter(c => c.due >= t && c.due <= end).reduce((s,c) => s + c.amount, 0);
  return { recs, collected, book, late, toCome, active, pct: book ? Math.round(collected / book * 100) : 0 };
}
function statusLine(c, s){
  const late = s.days < 0 ? `Late ${-s.days} day${s.days===-1?'':'s'}` : '';
  switch (s.phase) {
    case 'lapsed':   return { t:'Lapsed', cls:'' };
    case 'upcoming': return { t:`Due ${R2R.fmtDM(c.due)} · in ${s.days} day${s.days===1?'':'s'}`, cls:'' };
    case 'due':      return { t:'Due today', cls:'neg' };
    case 'ready':    return { t:`${late} · reminder ${s.next} ready`, cls:'neg' };
    case 'waiting':  return { t:`${late} · ${s.sent>=R2R.MAX_WA ? 'call them' : 'next reminder'} ${R2R.fmtDM(s.nextOn)}`, cls:'neg' };
    case 'call':     return { t:`${late} · call them`, cls:'neg' };
  }
  return { t:'', cls:'' };
}

      <div class="b ${st.cls}">${esc(st.t)}</div></div><div class="c">${R2R.inr(c.amount)}</div></a>`; }).join('')}</div>`;

  h += `<div class="cardx" style="margin-top:14px">
    <div class="rowx"><div><div class="a">Next 30 days</div><div class="b">${in30.length ? `${in30.length} renewal${in30.length>1?'s':''} · ${esc(in30.map(x=>first(x.c.name)).join(', '))}` : 'Nothing due'}</div></div>
      <div class="c">${R2R.inr(in30.reduce((s,x)=>s+x.c.amount,0))}</div></div>
    ${big ? `<div class="rowx"><div><div class="a">${R2R.MON[+big[0].slice(5)-1]} ${big[0].slice(0,4)}</div><div class="b">Biggest month left this year · ${big[1].n} renewal${big[1].n>1?'s':''}</div></div>
      <div class="c">${R2R.inr(big[1].amt)}</div></div>` : ''}
  </div>
  <a class="cardx" href="#setup" style="display:block;text-decoration:none"><div class="rowx"><div><div class="a">Autopilot</div>
    <div class="b">${S.conn ? (S.db.meta.lastRun ? `Last run ${new Date(S.db.meta.lastRun).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}${S.db.meta.lastOk===false?' · failed':''}` : 'Runs every morning at 07:00') : 'Not connected · reminders only on this phone'}</div></div>
    <div class="c ${S.conn && S.db.cfg.live ? 'pos' : ''}">${S.conn ? (S.db.cfg.live ? 'On' : 'Test') : 'Off'}</div></div></a>
  <div class="disclaimer">R2R · Risks to Reward. Renewal Desk keeps your client list on this phone${S.conn ? ' and in your Google Sheet' : ''}.</div>`;
  return h;
}

function vClients(){
  const t = today();
  let list = S.db.clients.map(c => ({ c, s:R2R.state(c,t) }));
  if (S.filter === 'Late') list = list.filter(x => ['due','ready','waiting','call'].includes(x.s.phase));
  if (S.filter === 'Lapsed') list = list.filter(x => x.s.phase === 'lapsed');
  if (S.filter === 'All') list = list.filter(x => x.s.phase !== 'lapsed');
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(x => x.c.name.toLowerCase().includes(q));
  list.sort((a,b) => a.c.due < b.c.due ? -1 : 1);
  const active = S.db.clients.filter(c=>c.status==='active');
  return `<div class="pg-head"><div class="pg-kicker">All clients</div><div class="pg-big">${active.length} active</div>
    <div class="pg-sub dim">${R2R.lakh(active.reduce((s,c)=>s+c.amount,0))} a year</div></div>
  <div class="seg" style="margin-bottom:12px">${['All','Late','Lapsed'].map(f => `<button class="${S.filter===f?'on':''}" onclick="S.filter='${f}';render()">${f}</button>`).join('')}</div>
  <input class="search" type="search" placeholder="Search by name" value="${esc(S.q)}" oninput="S.q=this.value;document.getElementById('clist').innerHTML=clientRows()" aria-label="Search clients">
  <div id="clist">${clientRows(list)}</div>
  <a class="btn" href="#add" style="margin-top:6px">Add client</a>`;
}
function clientRows(list){
  if (!list) { const t = today(); const q = S.q.trim().toLowerCase();
    list = S.db.clients.map(c=>({c,s:R2R.state(c,t)})).filter(x => S.filter==='Lapsed' ? x.s.phase==='lapsed' : S.filter==='Late' ? ['due','ready','waiting','call'].includes(x.s.phase) : x.s.phase!=='lapsed')
      .filter(x => !q || x.c.name.toLowerCase().includes(q)).sort((a,b)=>a.c.due<b.c.due?-1:1); }
  if (!list.length) return `<div class="empty">${S.q ? 'No client by that name.' : S.filter==='Late' ? 'Nobody is late. ' : S.filter==='Lapsed' ? 'No lapsed clients.' : 'No clients yet.'}</div>`;
  return `<div class="cream">${list.map(({c,s}) => { const st = statusLine(c,s);
    return `<a class="rowx" href="#client/${c.id}"><div><div class="a">${esc(c.name)}</div><div class="b ${st.cls}">${esc(st.t)}</div></div>
      <div class="c">${R2R.inr(c.amount)}</div></a>`; }).join('')}</div>`;
}

function vClient(id){
  const c = byId(id);
  if (!c) return `<div class="empty">That client is no longer on your books.</div><a class="btn" href="#clients">All clients</a>`;
  const t = today(), s = R2R.state(c,t), cyc = c.cycle, auto = !!(S.conn && S.db.cfg.live);
  const sub = s.phase==='lapsed' ? ['Lapsed · no reminders','dim'] : s.days > 0 ? [`Renews ${R2R.fmt(c.due)} · in ${s.days} days`,''] :
              s.days === 0 ? [`${R2R.inr(c.amount)} due today`,'warn'] : [`${R2R.inr(c.amount)} overdue · since ${R2R.fmtDM(c.due)}`,'neg'];
  const tagRow = (a, b, tag, cls, bcls) => `<div class="rowx"><div><div class="a">${a}</div><div class="b ${bcls||''}">${b}</div></div><span class="tag ${cls}">${tag}</span></div>`;

  let steps = '';
  if (c.status === 'active') {
    if (c.email) {
      steps += cyc.headsup ? tagRow('Heads-up email', `Sent ${R2R.fmt(cyc.headsup)}`, 'SENT', 'sent')
        : s.days > 0 ? tagRow('Heads-up email', `Goes out ${R2R.fmt(s.headsOn < t ? t : s.headsOn)}${auto ? '' : ' · once autopilot is live'}`, 'SCHEDULED', 'sched')
        : tagRow('Heads-up email', 'Not sent for this renewal', 'SKIPPED', 'skip');
      steps += cyc.invoice && cyc.invoice !== 'skipped' ? tagRow('Invoice email', `Sent ${R2R.fmt(cyc.invoice)} · ${esc(cyc.invNo||'')}`, 'SENT', 'sent')
        : cyc.invoice === 'skipped' ? tagRow('Invoice email', 'Already long overdue when autopilot started', 'SKIPPED', 'skip')
        : s.days >= -R2R.INVOICE_GRACE ? tagRow('Invoice email', `Goes out ${R2R.fmt(c.due < t ? t : c.due)}${auto ? '' : ' · once autopilot is live'}`, 'SCHEDULED', 'sched')
        : tagRow('Invoice email', 'Not emailed. Use Invoice below to share it', 'SKIPPED', 'skip');
    } else {
      steps += cyc.waHead ? tagRow('WhatsApp heads-up', `Sent by you · ${R2R.fmt(cyc.waHead)}`, 'SENT', 'sent')
        : s.waHead ? tagRow('WhatsApp heads-up', 'No email on file · ready to send', 'READY', 'ready', 'neg')
        : tagRow('Heads-up', 'No email on file. Add one in Edit', s.days > 0 ? 'LATER' : 'SKIPPED', s.days > 0 ? 'later' : 'skip');
    }
    for (let k = 1; k <= R2R.MAX_WA; k++) {
      const sentOn = cyc.wa[k-1];
      if (sentOn) steps += tagRow(`WhatsApp reminder ${k}`, `Sent by you · ${R2R.fmt(sentOn)}`, 'SENT', 'sent');
      else if (s.phase === 'ready' && s.next === k) steps += tagRow(`WhatsApp reminder ${k}`, 'Ready to send today', 'READY', 'ready', 'neg');
      else if (s.next === k && s.nextOn) steps += tagRow(`WhatsApp reminder ${k}`, `From ${R2R.fmt(s.nextOn)}, if still unpaid`, 'LATER', 'later');
      else steps += tagRow(`WhatsApp reminder ${k}`, k === 1 ? 'A week after the due date, if unpaid' : 'A week after the one before', 'LATER', 'later');
    }
    steps += s.days > 0 ? tagRow('Payment', `Due ${R2R.fmt(c.due)}`, 'LATER', 'later')
      : tagRow('Payment', s.phase === 'call' ? 'All reminders sent · give them a call' : 'Waiting', 'OPEN', 'open', 'neg');
  }

  const primary = s.phase === 'ready' ? `<button class="btn" onclick="openWA('${c.id}','reminder',true)">Send reminder ${s.next} on WhatsApp</button>`
    : s.waHead ? `<button class="btn" onclick="openWA('${c.id}','headsup',true)">Send heads-up on WhatsApp</button>`
    : c.status === 'active' ? `<button class="btn" onclick="openPay('${c.id}')">Record payment</button>`
    : `<button class="btn" onclick="reactivate('${c.id}')">Make active again</button>`;
  const second = (s.phase === 'ready' || s.waHead) ? `<button class="pill-btn" onclick="openPay('${c.id}')">Record payment</button>`
    : `<button class="pill-btn" onclick="openWA('${c.id}','${s.days > 0 ? 'headsup' : 'reminder'}',false)">WhatsApp</button>`;
  const recs = S.db.receipts.filter(r => r.clientId === c.id).sort((a,b) => a.date < b.date ? 1 : -1);

  return `<a class="pill-btn" href="#clients" style="margin-bottom:16px">← All clients</a>
  <div class="pg-head"><div class="pg-kicker">Client since ${R2R.fmt(c.anchor)}</div><div class="pg-big">${esc(c.name)}</div>
    <div class="pg-sub ${sub[1]}">${sub[0]}</div></div>
  <div class="pills two">
    <div class="pill butter"><span>Annual fee</span><b>${R2R.inr(c.amount)}</b></div>
    ${s.days <= 0 && c.status==='active' ? `<div class="pill lilac"><span>WhatsApp reminders</span><b>${cyc.wa.length} of ${R2R.MAX_WA} sent</b></div>`
      : `<div class="pill ${c.email?'mint':'blush'}"><span>Email</span><b>${c.email ? 'On file' : 'Missing'}</b></div>`}
  </div>
  ${c.status === 'active' ? `<div class="sec">This renewal</div><div class="cardx">${steps}</div>` : ''}
  <div class="stack">${primary}
    <div class="btn-row">${second}<button class="pill-btn" onclick="showInvoice('${c.id}')">Invoice</button><a class="pill-btn" href="#edit/${c.id}">Edit</a></div>
    ${c.status==='active' ? `<button class="link-btn" onclick="lapse('${c.id}')">Mark lapsed (stops reminders)</button>` : ''}
    ${cyc.wa.length || cyc.waHead ? `<button class="link-btn" onclick="undoWA('${c.id}')">Undo last WhatsApp “sent”</button>` : ''}
  </div>
  <div class="sec">History</div>
  <div class="cream">
    ${recs.map(r => `<div class="rowx"><div><div class="a">Paid · ${esc(r.no)}</div><div class="b">${R2R.fmt(r.date)}${r.period ? ` · year from ${R2R.fmtDM(r.period)}` : ''}</div></div><div class="c pos">${R2R.inr(r.amount)}</div></div>`).join('')}
    <div class="rowx"><div><div class="a">Joined</div><div class="b">${R2R.fmt(c.anchor)}</div></div><div class="c" style="font-weight:600;color:var(--text3)">${c.phone ? esc(c.phone) : ''}</div></div>
  </div>`;
}

function vMoney(){
  const fyNow = R2R.fyOf(today()), fy = S.fySel || fyNow, f = figures(fy), t = today();
  const start = R2R.fyStart(fy), y0 = +start.slice(0,4);
  const cols = [];
  for (let i = 0; i < 12; i++) {
    const m = (3 + i) % 12, y = m >= 3 ? y0 : y0 + 1, key = `${y}-${pad2(m+1)}`;
    const exp = f.active.filter(c => +c.anchor.slice(5,7) === m+1).reduce((s,c)=>s+c.amount,0);
    const inn = f.recs.filter(r => r.date.slice(0,7) === key).reduce((s,r)=>s + +r.amount,0);
    const late = f.active.filter(c => c.due.slice(0,7) === key && c.due < t).reduce((s,c)=>s+c.amount,0);
    cols.push({ label:R2R.MON[m][0], key, exp, inn, late, now: key === t.slice(0,7) });
  }
  const max = Math.max(1, ...cols.map(c => Math.max(c.exp, c.inn + c.late)));
  const px = v => Math.round(v / max * 146);
  return `<div class="seg" style="margin-bottom:18px">${[fyNow, R2R.prevFy(fyNow)].map((x,i) =>
      `<button class="${fy===x?'on':''}" onclick="S.fySel='${x}';render()">${i ? 'Last year' : 'This year'} · ${x}</button>`).join('')}</div>
  <div class="pg-head"><div class="pg-kicker">FY ${fy} · Apr ${y0} to Mar ${y0+1}</div><div class="pg-big">${R2R.inr(f.collected)} in</div>
    <div class="pg-sub">${f.recs.length} receipt${f.recs.length===1?'':'s'}${fy===fyNow ? ` · ${f.pct}% of book` : ''}</div></div>
  ${fy===fyNow ? `<div class="pills">
    <div class="pill mint"><span>Collected</span><b>${R2R.inr(f.collected)}</b></div>
    <div class="pill blush"><span>Late</span><b class="${f.late?'neg':''}">${R2R.inr(f.late)}</b></div>
    <div class="pill blue"><span>To come</span><b>${R2R.inr(f.toCome)}</b></div></div>` : ''}
  <div class="sec">Month by month</div>
  <div class="cardx pad">
    <div class="bars" role="img" aria-label="Renewals falling due and money collected each month, April to March">
      ${cols.map(c => `<div class="col" style="height:${Math.max(2, px(Math.max(c.exp, c.inn + c.late)))}px" title="${c.key}: due ${R2R.inr(c.exp)}, in ${R2R.inr(c.inn)}">
        <div class="late" style="height:${px(c.late)}px"></div><div class="in" style="height:${px(c.inn)}px"></div></div>`).join('')}
    </div>
    <div class="blabels">${cols.map(c => `<div class="${c.now?'now':''}">${c.label}</div>`).join('')}</div>
    <div class="legend"><span><i style="background:var(--pos)"></i>Collected</span><span><i style="background:var(--neg)"></i>Late</span><span><i style="background:var(--track);border:1px solid var(--border)"></i>Renewals due</span></div>
  </div>
  <div class="sec">Receipts <button class="pill-btn" onclick="exportCsv('${fy}')">Export</button></div>
  ${f.recs.length ? `<div class="cream">${f.recs.slice().sort((a,b)=>a.date<b.date?1:-1).map(r => `<div class="rowx"><div><div class="a">${esc(r.name)}</div>
    <div class="b">${R2R.fmt(r.date)} · ${esc(r.no)}</div></div><div class="c pos">${R2R.inr(r.amount)}</div></div>`).join('')}</div>`
    : `<div class="empty">No receipts in FY ${fy}.</div>`}`;
}

function toggleTheme(){
  const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); store.set(KEY_THEME, t);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#111413' : '#F2F3EE');
  render();
}
let toastT;
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2600); }

function pickFee(btn, val){
  btn.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  const inp = document.getElementById('f-amount');
  if (val === 'other') { inp.style.display = ''; inp.focus(); } else { inp.style.display = 'none'; inp.value = val; }
}
async function saveClient(e, id){
  e.preventDefault();
  const g = k => document.getElementById('f-' + k);
  const data = { name:g('name').value.trim(), email:g('email').value.trim(), phone:g('phone').value.trim(),
    amount:+g('amount').value || 0, anchor:g('anchor').value || today() };
  if (!data.name) return toast('Name is required');
  if (id) {
    data.id = id; data.due = g('due').value || byId(id).due; data.note = g('note').value.trim();
    await act('edit', data, 'Saved'); location.hash = '#client/' + id;
  } else {
    data.paidNow = g('paid').checked; data.newId = R2R.uid('c');
    await act('add', data, () => `${first(data.name)} added · ${S.conn ? 'autopilot is on it' : 'saved on this phone'}`);
    location.hash = '#client/' + data.newId;
  }
}
async function removeClient(id){
  const c = byId(id); if (!confirm(`Remove ${c.name}? Their past receipts are kept.`)) return;
  await act('remove', { id }, 'Removed'); location.hash = '#clients';
}
async function lapse(id){
  const c = byId(id); if (!confirm(`Mark ${c.name} as lapsed? Reminders stop. You can make them active again any time.`)) return;
  await act('status', { id, status:'lapsed' }, 'Marked lapsed');
}
async function reactivate(id){ await act('status', { id, status:'active', fresh:true }, c => `Active again · next renewal ${R2R.fmt(c.due)}`); }
async function undoWA(id){ await act('waUndo', { id }, 'Undone'); }

/* --- sheets --- */
function openSheet(html){ const s = document.getElementById('sheet'); s.innerHTML = '<div class="grab"></div>' + html;
  document.getElementById('sheet-scrim').classList.add('on'); requestAnimationFrame(()=>s.classList.add('on')); }
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); document.getElementById('sheet-scrim').classList.remove('on'); }
const xBtn = `<button class="x-btn" aria-label="Close" onclick="closeSheet()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

function openPay(id){
  const c = byId(id); if (!c) return;
  openSheet(`<div class="sheet-head"><div><div class="pg-kicker">Renewal due ${R2R.fmt(c.due)}</div><div class="t">Record payment · ${esc(first(c.name))}</div></div>${xBtn}</div>
    <div class="grid2">
      <div class="fld"><label for="p-amt">Amount received (₹)</label><input id="p-amt" type="number" inputmode="numeric" value="${c.amount}"></div>
      <div class="fld"><label for="p-date">Date received</label><input id="p-date" type="date" value="${today()}"></div>
    </div>
    <p class="muted">${S.conn && S.db.cfg.live && c.email ? `${esc(first(c.name))} gets a receipt by email.` : 'A receipt number is issued.'} The next renewal moves to ${R2R.fmt(R2R.addYears(c.due,1))}.</p>
    <button class="btn" onclick="doPay('${c.id}')">Record payment</button>`);
}
async function doPay(id){
  const amt = document.getElementById('p-amt').value, date = document.getElementById('p-date').value;
  if (!date) return toast('Pick the date it was received');
  if (amt === '' || isNaN(+amt)) return toast('Enter the amount received');
  closeSheet();
  await act('pay', { id, amount:+amt, date }, r => `Logged ${r.no}${r.emailed ? ' · receipt emailed' : ''} · next renewal ${R2R.fmt(byId(id).due)}`);
}

let WA = null;
function openWA(id, kind, isDue){
  const c = byId(id); if (!c) return;
  const s = R2R.state(c, today());
  WA = { id, kind, isDue };
  const label = kind === 'headsup' ? 'Heads-up' : isDue && s.next ? `Reminder ${s.next} of ${R2R.MAX_WA}` : 'Message';
  openSheet(`<div class="sheet-head"><div><div class="pg-kicker">${label} · ${c.phone ? esc(c.phone) : 'no number saved, you pick the chat'}</div>
      <div class="t">Message for ${esc(first(c.name))}</div></div>${xBtn}</div>
    ${kind === 'reminder' ? `<div class="seg" style="margin-bottom:12px">${['Gentle','Firm','Short'].map(t => `<button class="${S.tone===t?'on':''}" onclick="setTone('${t}',this)">${t}</button>`).join('')}</div>` : ''}
    <textarea class="msg" id="wa-text" aria-label="Message text">${esc(R2R.message(kind, S.tone, c, S.db.cfg))}</textarea>
    <p class="muted" style="margin:8px 0 0">You can change the words here or in WhatsApp before sending.</p>
    <div class="stack">
      <button class="btn" onclick="sendWA()">Open in WhatsApp</button>
      <div class="btn-row"><button class="pill-btn" onclick="copy(document.getElementById('wa-text').value,'Message copied')">Copy message</button>
        ${isDue ? `<button class="pill-btn fill" onclick="markWA()">Mark as sent</button>` : ''}</div>
    </div>`);
}
function setTone(t, btn){
  S.tone = t; btn.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
  document.getElementById('wa-text').value = R2R.message(WA.kind, t, byId(WA.id), S.db.cfg);
}
function sendWA(){
  const c = byId(WA.id), text = document.getElementById('wa-text').value;
  window.open(R2R.waLink(c.phone, text), '_blank');
  if (WA.isDue) markWA(true); else closeSheet();
}
async function markWA(quiet){
  const { id, kind } = WA; closeSheet();
  await act('wa', { id, kind }, quiet ? 'Marked as sent · undo on the client page' : 'Marked as sent');
}

/* --- invoice (to print or share yourself) --- */

      <div class="small" style="white-space:pre-line">${esc(cfg.addr)}</div></div>
      <div style="text-align:right"><div class="inv-lbl">Invoice</div><div style="font-weight:800;font-size:15px">${esc(no)}</div>
        <div class="inv-lbl" style="margin-top:12px">Issued</div><div style="font-size:13px">${R2R.fmt(issued)}</div>
        <div class="inv-lbl" style="margin-top:12px">Due</div><div style="font-size:13px">${R2R.fmt(c.due)}</div></div></div>
    <div class="inv-lbl">Billed to</div><div style="font-weight:800;font-size:16px">${esc(c.name)}</div>
    <div class="small">${esc(c.email)}${c.phone?' · '+esc(c.phone):''}</div>
    <table><thead><tr><th>Description</th><th class="num">Amount</th></tr></thead><tbody>
      <tr><td>${esc(desc)}<div class="small" style="margin-top:4px">Subscription period ${R2R.fmt(c.due)} — ${R2R.fmt(end)}</div></td><td class="num">${R2R.inr(c.amount)}</td></tr>
      <tr class="total"><td>Total payable</td><td class="num">${R2R.inr(c.amount)}</td></tr></tbody></table>

function closeInvoice(){ document.getElementById('inv-wrap').classList.remove('on'); }
function printInvoice(){ document.body.classList.add('printing'); window.print(); setTimeout(()=>document.body.classList.remove('printing'), 500); }

/* --- autopilot connection --- */
async function connect(){
  const raw = document.getElementById('conn-link').value.trim();
  let url, key;
  try { const u = new URL(raw); key = u.searchParams.get('key'); url = u.origin + u.pathname; } catch(e) {}
  if (!url || !/script\.google(usercontent)?\.com$/.test(new URL(url).hostname)) return connErr('That isn’t the connection link. In the Sheet use R2R → Show connection link and copy the whole thing.');
  if (/\/dev$/.test(url)) return connErr('That is the test (/dev) address. Use R2R → Show connection link in the Sheet; it should end in /exec?key=…');
  if (!key || key === 'null') return connErr('The link has no key. In Apps Script, run “setup” once, then copy the link again from R2R → Show connection link.');
  document.body.classList.add('busy');
  try {
    let res;
    try { res = await fetch(`${url}?a=get&key=${encodeURIComponent(key)}`); }
    catch(e) { throw new Error('Could not reach Google. Check your signal. If you have signal, open Apps Script → Deploy → Manage deployments and check “Who has access” is set to Anyone.'); }
    const txt = await res.text();
    let j; try { j = JSON.parse(txt); } catch(e) {
      throw new Error('Google asked for a sign-in instead of answering. In Apps Script: Deploy → Manage deployments → pencil icon → Who has access: Anyone → Version: New version → Deploy. Then try again.');
    }
    if (!j.ok) throw new Error(j.error);
    S.conn = { url, key }; store.set(KEY_CONN, JSON.stringify(S.conn));
    const server = R2R.normalize(j.db);
    if (!server.clients.length && S.db.clients.length) {
      await call('import', { db: S.db });
      toast(`Connected · your ${S.db.clients.length} clients are now in the Sheet`);
    } else {
      S.db = server; S.synced = new Date(); persist();
      toast(`Connected · ${server.clients.length} clients loaded from the Sheet`);
    }
    render();
  } catch(e) { connErr(e.message || 'Could not connect.'); }
  finally { document.body.classList.remove('busy'); }
}
/* connection problems stay on screen (a toast vanishes before you can read the fix) */
function connErr(msg){
  let el = document.getElementById('conn-err');
  if (!el) { el = document.createElement('div'); el.id = 'conn-err'; el.className = 'blush'; el.style.marginTop = '12px';
    el.style.fontSize = '13px'; el.style.lineHeight = '1.5'; document.getElementById('conn-link')?.closest('.cardx')?.appendChild(el); }
  el.innerHTML = '<h4>Couldn’t connect</h4>' + esc(msg);
}
function disconnect(){
  if (!confirm('Disconnect this phone? The autopilot keeps running, and your list stays in the Sheet.')) return;
  S.conn = null; S.synced = null; store.del(KEY_CONN); render(); toast('Disconnected');
}
async function setLive(on){
  if (on) {
    const t = today(), list = S.db.clients.filter(c => c.status === 'active' && c.email);
    const soon = list.filter(c => { const d = R2R.diff(t, c.due); return d >= -R2R.INVOICE_GRACE && d <= R2R.HEADSUP_DAYS; });
    if (!confirm(`Go live? From tomorrow 07:00, clients get emails.${soon.length ? `\n\nFirst up: ${soon.map(c=>c.name).join(', ')}.` : ''}\n\nClients more than ${R2R.INVOICE_GRACE} days overdue don’t get an automatic invoice. Use WhatsApp for them.`)) return;
  }
  await act('live', { live:on }, on ? 'Autopilot is live' : 'Back to test mode');
}
async function runNow(){
  if (S.db.cfg.live && !confirm('Run the morning check now? Any emails due today go out to clients.')) return;
  await act('run', {}, 'Done · check your inbox for the digest');
}
async function saveCfg(e){
  e.preventDefault();
  const a = {}; ['name','biz','email','phone','upi','pay','addr','prefix'].forEach(k => a[k] = document.getElementById('cfg-' + k).value);
  await act('cfg', a, 'Details saved');
}

/* --- files --- */
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function exportCsv(fy){
  const rows = [['Date','Receipt no','Client','Amount (INR)','For renewal of']].concat(
    S.db.receipts.filter(r => r.date >= R2R.fyStart(fy) && r.date <= R2R.fyEnd(fy)).sort((a,b)=>a.date<b.date?-1:1)
      .map(r => [r.date, r.no, r.name, r.amount, r.period || '']));
  download(`r2r-receipts-FY${fy}.csv`, rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n'), 'text/csv');
  toast('Receipts downloaded');
}
function exportBackup(){ download(`r2r-desk-${today()}.json`, JSON.stringify(S.db, null, 2), 'application/json'); toast('Backup downloaded'); }
function importBackup(e){
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    let db; try { db = JSON.parse(r.result); } catch(err) { return toast('That file could not be read'); }
    db = (db.clients && db.clients.length && !db.clients[0].cycle && !db.meta) ? migrate(db) : R2R.normalize(db);
    if (!confirm(`Replace the current list with this backup (${db.clients.length} clients)?`)) return;
    if (S.conn) { try { await call('import', { db, force:true }); } catch(err) { return toast(err.message); } }
    else { S.db = db; persist(); }
    render(); toast('Backup restored');
  };
  r.readAsText(f);
}
const icsEsc = s => String(s ?? '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function downloadIcs(){
  const list = S.db.clients.filter(c => c.status === 'active'); if (!list.length) return toast('No clients yet');
  const ev = list.flatMap(c => { const s = c.due.replace(/-/g,''), e = R2R.addDays(c.due,1).replace(/-/g,'');
    return ['BEGIN:VEVENT',`UID:r2r-${c.id}@r2rtutorials`,`DTSTAMP:${today().replace(/-/g,'')}T000000Z`,`DTSTART;VALUE=DATE:${s}`,`DTEND;VALUE=DATE:${e}`,
      'RRULE:FREQ=YEARLY',`SUMMARY:${icsEsc(`R2R renewal · ${c.name} (${R2R.inr(c.amount)})`)}`,'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(c.name + ' renewal in 7 days')}`,'END:VALARM','END:VEVENT']; });
  download(`r2r-renewals-${today()}.ics`, ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//R2R Tutorials//Renewal Desk//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'X-WR-CALNAME:R2R Renewals', ...ev, 'END:VCALENDAR'].join('\r\n'), 'text/calendar;charset=utf-8');
  toast('Open the file to add renewals to your calendar');
}

/* --- contacts (Chrome on Android) --- */
const canPick = ('contacts' in navigator) && ('ContactsManager' in window);
async function fromContacts(editing){
  try {
    const [p] = await navigator.contacts.select(['name','email','tel'], { multiple:false });
    if (!p) return;
    const set = (id, v) => { const el = document.getElementById(id); if (v && !(editing && id === 'f-name')) el.value = v; };
    set('f-name', p.name && p.name[0]);
    set('f-email', p.email && p.email[0]);
    set('f-phone', p.tel && p.tel[0]);
    toast(editing ? 'Number and email filled in · tap Save changes' : 'Contact filled in');
  } catch(err) { toast('Contacts were not shared'); }
}

function copy(txt, msg){
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>fallbackCopy(txt,msg));
  else fallbackCopy(txt, msg);
}
function fallbackCopy(txt, msg){
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = 0;
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e) { prompt('Copy this:', txt); }
  ta.remove();
}

/* --- install + offline --- */
let deferredInstall = null;
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (route().v === 'setup') render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; toast('Installed'); });
function installHint(){
  if (standalone) return 'Installed. You are using the app version.';
  if (deferredInstall) return 'Adds a Renewal Desk icon to your home screen. It opens full screen and works without a signal.';
  if (isIOS) return 'In Safari, tap Share, then Add to Home Screen. Chrome on iPhone cannot install it, so use Safari.';
  return 'Use your browser menu and choose Install app or Add to Home screen.';
}
async function doInstall(){ if (!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; render(); }
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const w = reg.installing;
        w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Update ready. Close and reopen the app.'); }); });
    }).catch(()=>{});
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeSheet(); closeInvoice(); menu(false); } });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(true); });

/* ================= start ================= */
load();
render();
pull(true);
(function(){                      // links from the digest email: ?pay=<client id>
  const p = new URLSearchParams(location.search).get('pay');
  if (p && byId(p)) { location.hash = '#client/' + p; setTimeout(()=>openPay(p), 300); }
})();
